<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pagamento pendente — Luciana & Wellington</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root { --lav-pale:#f5f3fb; --lav-mid:#7b62bc; --lav-dark:#4e3a85; --gold:#b8a06a; --text:#2d2540; --text-lt:#7a6e9a; --white:#ffffff; }
    body { font-family:'Jost',sans-serif; background:var(--lav-pale); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .card { background:var(--white); border-radius:2px; max-width:480px; width:100%; padding:3rem 2.5rem; text-align:center; box-shadow:0 8px 40px rgba(78,58,133,.08); }
    .emoji { font-size:4rem; margin-bottom:1.5rem; }
    h1 { font-family:'Cormorant Garamond',serif; font-size:2.2rem; font-weight:300; margin-bottom:.6rem; }
    p { font-size:.92rem; color:var(--text-lt); line-height:1.8; margin-bottom:1.5rem; }
    .btn { display:inline-block; padding:.75rem 2rem; background:var(--lav-mid); color:var(--white); font-family:'Jost',sans-serif; font-size:.78rem; letter-spacing:.15em; text-transform:uppercase; text-decoration:none; border-radius:1px; }
  </style>
</head>
<body>
<div class="card">
  <div class="emoji">⏳</div>
  <h1>Pagamento em análise</h1>
  <p>Seu pagamento está sendo processado. Assim que confirmado, sua contribuição será registrada automaticamente. Você receberá uma confirmação em breve.</p>
  <p style="font-size:.82rem">Se tiver dúvidas, entre em contato com os noivos.</p>
  <a href="/" class="btn">← Voltar à lista</a>
</div>
</body>
</html>
